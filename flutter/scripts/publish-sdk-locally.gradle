// Publishes this repository's Android SDK to the local Maven repository (~/.m2) as ai.clomni:messenger:1.0.0, for a
// Flutter app (or the example) to build against before the SDK is on Maven Central. An included build cannot do it
// there: Flutter 3.47's apps use AGP 9, the SDK AGP 8, and one build cannot hold both. The SDK's own build files stay
// as they are; this init script adds the publication.
//   cd android && ./gradlew --init-script ../flutter/scripts/publish-sdk-locally.gradle \
//       :messenger:publishReleasePublicationToMavenLocal
allprojects { project ->
    if (project.path != ':messenger') return
    project.plugins.withId('com.android.library') {
        project.android.publishing { singleVariant('release') }
        project.apply plugin: 'maven-publish'
        project.afterEvaluate {
            project.publishing {
                publications {
                    release(MavenPublication) {
                        from project.components.release
                        groupId = 'ai.clomni'
                        artifactId = 'messenger'
                        version = '1.0.0'
                    }
                }
            }
        }
    }
}
