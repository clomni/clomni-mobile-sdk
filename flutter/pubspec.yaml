name: clomni_flutter
description: "Clomni Messenger for Flutter: the native iOS and Android SDKs behind one Dart API."
version: 1.0.0
homepage: https://clomni.ai
repository: https://github.com/rzayevkenann/clomni-mobile-sdk/tree/main/flutter
publish_to: none

environment:
  # Flutter 3.16 ships Dart 3.2 (brief 8 · 9: Flutter 3.16+).
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: ai.clomni.clomni_flutter
        pluginClass: ClomniFlutterPlugin
      ios:
        pluginClass: ClomniFlutterPlugin
