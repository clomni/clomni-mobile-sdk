name: Android device tests

# The emulator job, apart from Android's main workflow: on GitHub's hosted runner the emulator often never boots, and
# such a run was red for the runner, not for the code. So it runs on demand and once a week, not on every push.
on:
  workflow_dispatch:
  schedule:
    # Mondays 04:00 UTC.
    - cron: '0 4 * * 1'

concurrency:
  group: android-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The tests that need a device (src/androidTest): the Keystore, the activity lifecycle, initialize under StrictMode
  # within 50 ms, Google's Accessibility Test Framework over the screens. On an emulator here only: never on the
  # development server.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # API 34 google_apis and API 33 default never booted on the hosted runner (port 5554 never answered); API 30's
      # plain AOSP image does.
      matrix:
        api-level: [30]
    env:
      ARCH: x86_64
      TARGET: default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # /dev/kvm is root's on the runner; the emulator runs as the runner user and needs it for hardware acceleration.
      # The rule is applied (trigger) before anything starts the emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Diagnostics for the log: is KVM there and usable, which emulator, how much room.
      - name: Check acceleration
        run: |
          ls -l /dev/kvm || echo "no /dev/kvm"
          nproc; free -h; df -h "$HOME" | tail -1
          "$ANDROID_HOME/emulator/emulator" -version | head -1 || true
          "$ANDROID_HOME/emulator/emulator" -accel-check || true
      # Compiled before the emulator starts, so its boot does not compete with Gradle for the runner's CPU and memory.
      - name: Build the test APKs
        working-directory: android
        run: ./gradlew --no-daemon :messenger:assembleDebugAndroidTest
      # The emulator-runner's recommended flow: a booted AVD snapshot, cached; the first run makes it (empty cache).
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ env.TARGET }}-${{ env.ARCH }}
      - name: Create the AVD and its snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ env.ARCH }}
          target: ${{ env.TARGET }}
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -accel on
          disable-animations: false
          script: |
            adb devices -l
            adb shell getprop ro.build.version.sdk
      # Once in a while the emulator never answers on its console port ("could not connect to TCP port 5554") although
      # the previous run passed: the first attempt may fail, the retry below then decides the job.
      - name: Device tests
        id: device-tests
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ env.ARCH }}
          target: ${{ env.TARGET }}
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -accel on
          disable-animations: true
          working-directory: android
          # The emulator's crashpad_handler outlives it and kept the job open after the tests had passed, until the
          # job's 60 minutes cancelled it (2026-10-09). It goes with the tests, whatever they answered.
          script: |
            adb devices -l
            ./gradlew --no-daemon :messenger:connectedDebugAndroidTest; status=$?; killall -INT crashpad_handler || true; exit $status
      - name: Device tests (retry once)
        if: steps.device-tests.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ env.ARCH }}
          target: ${{ env.TARGET }}
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -accel on
          disable-animations: true
          working-directory: android
          # The emulator's crashpad_handler outlives it and kept the job open after the tests had passed, until the
          # job's 60 minutes cancelled it (2026-10-09). It goes with the tests, whatever they answered.
          script: |
            adb devices -l
            ./gradlew --no-daemon :messenger:connectedDebugAndroidTest; status=$?; killall -INT crashpad_handler || true; exit $status
      # When it fails: what adb and the emulator saw.
      - name: Emulator state on failure
        if: failure() || steps.device-tests.outcome == 'failure'
        run: |
          adb devices -l || true
          ls -la ~/.android/avd || true
          find ~/.android/avd -name '*.log' -exec tail -n 50 {} \; 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-reports-${{ matrix.api-level }}
          path: android/messenger/build/reports/androidTests/
          if-no-files-found: ignore
