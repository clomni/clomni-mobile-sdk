name: iOS

# The repository is public since 2026-10-06: macOS minutes are not counted against a quota any more.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'protocol/**'
      - 'ClomniMessenger.podspec'
      - 'Package.swift'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'protocol/**'
      - 'ClomniMessenger.podspec'
      - 'Package.swift'
      - '.github/workflows/ios.yml'

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Xcode 16: Swift 6, so the Example's strict concurrency is checked by the compiler the apps will use.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      # The tests read protocol/fixtures from the checkout, so a fixture change runs them too.
      - name: swift test
        run: swift test --enable-code-coverage

      # Linux has no UIKit or SwiftUI; this is where the UI code gets compiled.
      - name: Build for the iOS Simulator
        run: >
          xcodebuild build
          -scheme ClomniMessenger
          -destination 'generic/platform=iOS Simulator'
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO

      # A package with one library gets one scheme, named after it, and it carries the test targets too.
      # The snapshot tests need UIKit. A run without references records them and passes; the pictures are in the
      # "snapshots" artifact, to be checked and committed under ios/Tests/ClomniMessengerTests/__Snapshots__.
      - name: Snapshot tests on the iOS Simulator
        run: >
          xcodebuild test
          -scheme ClomniMessenger
          -destination 'platform=iOS Simulator,name=iPhone 16'
          -only-testing:ClomniMessengerTests
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO

      - name: Keep the snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: ios/Tests/ClomniMessengerTests/__Snapshots__
          if-no-files-found: ignore

      # The Example app and the Notification Service Extension: the integration code the customer docs show.
      - name: Build the Example app
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/Example/project.yml
          xcodebuild build \
            -project ios/Example/ClomniExample.xcodeproj \
            -scheme ClomniExample \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      # DoD 11: the SDK as a Release arm64 framework is at most 3 MB; the step prints the sizes.
      - name: Framework size
        run: scripts/ios-framework-size.sh

      # CocoaPods builds every target as one module; the podspec's -package-name keeps it building.
      - name: pod lib lint
        run: pod lib lint ClomniMessenger.podspec --platforms=ios

  # DESIGN-PASS-3 H1, H2, H4 on a simulator: the Example app's UI tests (ios/Example/ClomniExampleUITests) open the
  # messenger's conversation in its page sheet with a fixed conversation, bring up the software keyboard and measure
  # what it covers. The screenshots, keyboard up, are the "ui-test-screenshots" artifact. Xcode 26 and its iOS 26
  # simulator: what the TestFlight builds are made with.
  ui-test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Generate the Example project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/Example/project.yml

      # A plain iPhone of the newest iOS runtime, booted with the software keyboard: the hardware one would keep it
      # down, and there would be nothing to measure.
      - name: Simulator with the software keyboard
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | test("SimRuntime\\.iOS"))] | sort_by(.key) | last | .value
            | (map(select(.name | test("^iPhone [0-9]+$"))) + map(select(.name | startswith("iPhone")))) | first | .udid')
          test -n "$udid" && test "$udid" != null
          xcrun simctl list devices | grep "$udid"
          plist=~/Library/Preferences/com.apple.iphonesimulator.plist
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          /usr/libexec/PlistBuddy -c "Add :DevicePreferences dict" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :DevicePreferences:$udid dict" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :DevicePreferences:$udid:ConnectHardwareKeyboard bool false" "$plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :DevicePreferences:$udid:ConnectHardwareKeyboard false" "$plist"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # The tests write their own screenshots as <name>.png into CLOMNI_SCREENSHOTS (passed to the test runner by the
      # TEST_RUNNER_ prefix); only that folder is uploaded. The result bundle's attachments are not: some of their
      # names (XCTest's debug descriptions) have quotes, which upload-artifact refuses.
      # Up to 3 tries per test: the runner's simulator sometimes times out a screenshot or drops a home press
      # (9812c1e, f22aecb). A real defect fails all three.
      - name: UI tests (keyboard, scrolling to the end, the time in the bubble)
        env:
          TEST_RUNNER_CLOMNI_SCREENSHOTS: ${{ github.workspace }}/ui-screenshots
        run: >
          xcodebuild test
          -project ios/Example/ClomniExample.xcodeproj
          -scheme ClomniExample
          -destination "id=${{ steps.sim.outputs.udid }}"
          -only-testing:ClomniExampleUITests
          -retry-tests-on-failure -test-iterations 3
          -resultBundlePath ui-tests.xcresult
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots
          path: ui-screenshots/*.png
          if-no-files-found: warn

      - name: Keep the result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tests-xcresult
          path: ui-tests.xcresult
          if-no-files-found: ignore
