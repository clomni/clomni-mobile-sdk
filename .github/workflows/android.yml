name: Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'protocol/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'protocol/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Unit tests against protocol/fixtures, the Paparazzi screenshots against src/test/snapshots (each also checking
      # 48 dp tap targets), Protocol and Store coverage of at least 80% (lines and branches), the public API against
      # messenger/api/messenger.api, the release AAR at most 2 MB, the device tests compiled (they run on an emulator
      # in android-device.yml), and the sample.
      - run: ./gradlew --no-daemon :messenger:verifyPaparazziDebug :messenger:koverVerifyDebug :messenger:koverXmlReportDebug :messenger:apiCheck :messenger:checkAarSize :messenger:assembleDebugAndroidTest :sample:assembleDebug
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/messenger/build/reports/tests/
            android/messenger/build/reports/kover/
            android/messenger/build/reports/paparazzi/
            android/messenger/build/paparazzi/failures/
          if-no-files-found: ignore
