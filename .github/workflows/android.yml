name: Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'protocol/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'protocol/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Unit tests against protocol/fixtures, the Paparazzi screenshots against src/test/snapshots (each also checking
      # 48 dp tap targets), Protocol and Store coverage of at least 80% (lines and branches), the public API against
      # messenger/api/messenger.api, the release AAR at most 1.5 MB, the device tests compiled, and the sample.
      - run: ./gradlew --no-daemon :messenger:verifyPaparazziDebug :messenger:koverVerifyDebug :messenger:koverXmlReportDebug :messenger:apiCheck :messenger:checkAarSize :messenger:assembleDebugAndroidTest :sample:assembleDebug
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/messenger/build/reports/tests/
            android/messenger/build/reports/kover/
            android/messenger/build/reports/paparazzi/
            android/messenger/build/paparazzi/failures/
          if-no-files-found: ignore

  # The tests that need a device (src/androidTest): the Keystore, the activity lifecycle, initialize under StrictMode
  # within 50 ms, Google's Accessibility Test Framework over the screens. On an emulator here only: never on the
  # development server.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_LEVEL: 34
      ARCH: x86_64
      TARGET: google_apis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # The runner's /dev/kvm is root's; the emulator runs as the runner user and needs it for hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Compiled before the emulator starts, so its boot does not compete with Gradle for the runner's CPU and memory.
      - name: Build the test APKs
        working-directory: android
        run: ./gradlew --no-daemon :messenger:assembleDebugAndroidTest
      # The emulator-runner's recommended flow: a booted AVD snapshot, cached; made once, reused after.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.TARGET }}-${{ env.ARCH }}
      - name: Create the AVD and its snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: ${{ env.ARCH }}
          target: ${{ env.TARGET }}
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot made"
      - name: Device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: ${{ env.ARCH }}
          target: ${{ env.TARGET }}
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon :messenger:connectedDebugAndroidTest
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-reports
          path: android/messenger/build/reports/androidTests/
          if-no-files-found: ignore
