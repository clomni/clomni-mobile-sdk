name: Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'protocol/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'protocol/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Unit tests against protocol/fixtures, the Paparazzi screenshots against src/test/snapshots (each also checking
      # 48 dp tap targets), Protocol and Store coverage of at least 80% (lines and branches), the public API against
      # messenger/api/messenger.api, the release AAR at most 2 MB, the device tests compiled, and the sample.
      - run: ./gradlew --no-daemon :messenger:verifyPaparazziDebug :messenger:koverVerifyDebug :messenger:koverXmlReportDebug :messenger:apiCheck :messenger:checkAarSize :messenger:assembleDebugAndroidTest :sample:assembleDebug
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/messenger/build/reports/tests/
            android/messenger/build/reports/kover/
            android/messenger/build/reports/paparazzi/
            android/messenger/build/paparazzi/failures/
          if-no-files-found: ignore

  # The tests that need a device (src/androidTest): the Keystore, the activity lifecycle, initialize under StrictMode
  # within 50 ms, Google's Accessibility Test Framework over the screens. On an emulator here only: never on the
  # development server.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # API 34 google_apis and API 33 default never booted on the hosted runner (port 5554 never answered); API 30's
      # plain AOSP image does.
      matrix:
        api-level: [30]
    env:
      ARCH: x86_64
      TARGET: default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # /dev/kvm is root's on the runner; the emulator runs as the runner user and needs it for hardware acceleration.
      # The rule is applied (trigger) before anything starts the emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Diagnostics for the log: is KVM there and usable, which emulator, how much room.
      - name: Check acceleration
        run: |
          ls -l /dev/kvm || echo "no /dev/kvm"
          nproc; free -h; df -h "$HOME" | tail -1
          "$ANDROID_HOME/emulator/emulator" -version | head -1 || true
          "$ANDROID_HOME/emulator/emulator" -accel-check || true
      # Compiled before the emulator starts, so its boot does not compete with Gradle for the runner's CPU and memory.
      - name: Build the test APKs
        working-directory: android
        run: ./gradlew --no-daemon :messenger:assembleDebugAndroidTest
      # The emulator-runner's recommended flow: a booted AVD snapshot, cached; the first run makes it (empty cache).
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ env.TARGET }}-${{ env.ARCH }}
      - name: Create the AVD and its snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ env.ARCH }}
          target: ${{ env.TARGET }}
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -accel on
          disable-animations: false
          script: |
            adb devices -l
            adb shell getprop ro.build.version.sdk
      # Once in a while the emulator never answers on its console port ("could not connect to TCP port 5554") although
      # the previous run passed: the first attempt may fail, the retry below then decides the job.
      - name: Device tests
        id: device-tests
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ env.ARCH }}
          target: ${{ env.TARGET }}
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -accel on
          disable-animations: true
          working-directory: android
          script: |
            adb devices -l
            ./gradlew --no-daemon :messenger:connectedDebugAndroidTest
      - name: Device tests (retry once)
        if: steps.device-tests.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ env.ARCH }}
          target: ${{ env.TARGET }}
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -accel on
          disable-animations: true
          working-directory: android
          script: |
            adb devices -l
            ./gradlew --no-daemon :messenger:connectedDebugAndroidTest
      # When it fails: what adb and the emulator saw.
      - name: Emulator state on failure
        if: failure() || steps.device-tests.outcome == 'failure'
        run: |
          adb devices -l || true
          ls -la ~/.android/avd || true
          find ~/.android/avd -name '*.log' -exec tail -n 50 {} \; 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-reports-${{ matrix.api-level }}
          path: android/messenger/build/reports/androidTests/
          if-no-files-found: ignore
