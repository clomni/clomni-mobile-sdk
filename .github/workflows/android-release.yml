name: Android release

# ai.clomni:messenger to Maven Central (Central Portal). A tag android-v1.2.3 releases 1.2.3; "Run workflow" with a
# version does the same by hand. Without the secrets below it is a dry run: everything is built, tested and bundled,
# the unsigned bundle is kept as an artifact, and nothing is uploaded.
#
# Secrets: CLOMNI_SIGNING_KEY (ASCII-armoured private PGP key), CLOMNI_SIGNING_PASSWORD, CENTRAL_USERNAME and
# CENTRAL_PASSWORD (a Central Portal user token for the verified namespace ai.clomni).
#
# The upload is USER_MANAGED: the workflow prints the deployment id and waits until the Portal has validated it. It then
# stays there until someone presses "Publish" in the Portal, or the workflow is run with publish ticked, which
# publishes it to Maven Central (final: a version on Maven Central can never be changed or removed).
on:
  push:
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.0.0'
        required: true
      upload:
        description: 'Upload to the Central Portal (needs the secrets)'
        type: boolean
        default: false
      publish:
        description: 'After validation, publish to Maven Central (needs upload; cannot be undone)'
        type: boolean
        default: false

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    env:
      CLOMNI_SIGNING_KEY: ${{ secrets.CLOMNI_SIGNING_KEY }}
      CLOMNI_SIGNING_PASSWORD: ${{ secrets.CLOMNI_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then v="${GITHUB_REF_NAME#android-v}"; else v="${{ inputs.version }}"; fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "not a version: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ -n "$CLOMNI_SIGNING_KEY" ] && [ -n "${{ secrets.CENTRAL_USERNAME }}" ] && { [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.upload }}" = "true" ]; }; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dry run: no signing key or Central credentials (or upload not asked); nothing is uploaded."
          fi
      # The same checks as every pull request, then the bundle (signed when the key is there).
      - run: >-
          ./gradlew --no-daemon -Pclomni.version=${{ steps.version.outputs.version }}
          :messenger:testDebugUnitTest :messenger:verifyPaparazziDebug :messenger:apiCheck :messenger:checkAarSize
          :messenger:publishReleasePublicationToCentralBundleRepository
      - name: Bundle
        run: |
          cd messenger/build/central-bundle
          # Central takes the version's files; the folder-level maven-metadata is the repository's, not the release's.
          zip -r ../central-bundle.zip ai -x '*/maven-metadata.xml*'
          unzip -l ../central-bundle.zip
      - uses: actions/upload-artifact@v4
        with:
          name: central-bundle-${{ steps.version.outputs.version }}
          path: android/messenger/build/central-bundle.zip
      - name: Upload to the Central Portal
        if: steps.version.outputs.upload == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          token=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          api=https://central.sonatype.com/api/v1/publisher
          # USER_MANAGED: the deployment waits in the Portal for a person (or `publish` below) to publish it.
          id=$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $token" \
            -F "bundle=@messenger/build/central-bundle.zip" \
            "$api/upload?name=messenger-${{ steps.version.outputs.version }}&publishingType=USER_MANAGED")
          echo "Deployment id: $id"
          echo "### Central Portal deployment \`$id\`" >> "$GITHUB_STEP_SUMMARY"

          # PENDING → VALIDATING → VALIDATED (or FAILED, with the reasons). Usually a minute or two.
          state=
          for _ in $(seq 1 90); do
            status=$(curl --fail-with-body -sS -X POST -H "Authorization: Bearer $token" "$api/status?id=$id")
            state=$(echo "$status" | jq -r .deploymentState)
            echo "state: $state"
            case "$state" in
              VALIDATED) break ;;
              FAILED) echo "$status" | jq .errors; echo "::error::deployment $id failed validation"; exit 1 ;;
            esac
            sleep 10
          done
          [ "$state" = VALIDATED ] || { echo "::error::deployment $id is $state, not VALIDATED"; exit 1; }
          echo "Validated: $(echo "$status" | jq -c .purls)"

          if [ "$PUBLISH" = true ]; then
            curl --fail-with-body -sS -X POST -H "Authorization: Bearer $token" "$api/deployment/$id"
            echo "Publishing deployment $id to Maven Central."
            echo "Publish requested: Maven Central has it within about 30 minutes." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::Deployment $id is validated and waits in the Central Portal; publish it there or run with publish."
            echo "Validated; waiting in the Central Portal for Publish." >> "$GITHUB_STEP_SUMMARY"
          fi
