name: iOS TestFlight

# The Example app (ios/Example) to TestFlight. Signed manually for distribution: the certificate and the two App Store
# profiles come from secrets that ios-signing-setup.yml writes (run it once first). Automatic signing is not used: it
# asks for a development profile, and the team has no registered device. What has to exist on Apple's side first:
# ios/Example/README.md.
#
# Secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the text of AuthKey_<id>.p8, for the upload), the
# signing set IOS_DIST_P12, IOS_DIST_P12_PASSWORD, IOS_PROFILE_APP, IOS_PROFILE_NSE, IOS_PROFILE_APP_NAME,
# IOS_PROFILE_NSE_NAME, and the demo inbox's CLOMNI_APP_ID and CLOMNI_IOS_KEY. The job runs in the GitHub environment named by the input, so a "prod" environment
# can hold its own CLOMNI_* pair; a repository secret is used where the environment has none.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Clomni server the app talks to'
        type: choice
        options: [dev, prod]
        default: dev
      build_number:
        description: 'Build number (CFBundleVersion); the run number when empty. Higher than the last upload.'
        required: false

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    # App Store Connect takes only builds from the iOS 26 SDK (Xcode 26) on.
    runs-on: macos-26
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    env:
      CLOMNI_ENV: ${{ inputs.environment }}
    steps:
      - name: Secrets and build number
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          CLOMNI_APP_ID: ${{ secrets.CLOMNI_APP_ID }}
          CLOMNI_IOS_KEY: ${{ secrets.CLOMNI_IOS_KEY }}
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE_APP: ${{ secrets.IOS_PROFILE_APP }}
          IOS_PROFILE_NSE: ${{ secrets.IOS_PROFILE_NSE }}
          IOS_PROFILE_APP_NAME: ${{ secrets.IOS_PROFILE_APP_NAME }}
          IOS_PROFILE_NSE_NAME: ${{ secrets.IOS_PROFILE_NSE_NAME }}
          INPUT_BUILD: ${{ inputs.build_number }}
        run: |
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 CLOMNI_APP_ID CLOMNI_IOS_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets not set:$missing. Settings → Secrets and variables → Actions (see ios/Example/README.md, TestFlight)."
            exit 1
          fi
          missing=""
          for name in IOS_DIST_P12 IOS_DIST_P12_PASSWORD IOS_PROFILE_APP IOS_PROFILE_NSE IOS_PROFILE_APP_NAME IOS_PROFILE_NSE_NAME; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Signing secrets not set:$missing. Run the iOS signing setup workflow (ios-signing-setup.yml) first."
            exit 1
          fi
          if ! printf '%s' "$ASC_KEY_P8" | grep -q -- '-----BEGIN PRIVATE KEY-----'; then
            echo "::error::ASC_KEY_P8 is not the text of an AuthKey_<id>.p8 file (-----BEGIN PRIVATE KEY----- ...)."
            exit 1
          fi
          build="${INPUT_BUILD:-$GITHUB_RUN_NUMBER}"
          if ! [[ "$build" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::build_number \"$build\" is not a number like 42 or 42.1."
            exit 1
          fi
          {
            echo "BUILD_NUMBER=$build"
            echo "ARCHIVE=$RUNNER_TEMP/ClomniExample.xcarchive"
            echo "EXPORT=$RUNNER_TEMP/export"
            echo "KEYCHAIN=$RUNNER_TEMP/signing.keychain-db"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      # The SDK has no public way to change its server, so a dev build gets the dev address in the checkout only,
      # as the Android test APK does. The repository keeps app.clomni.ai.
      - name: Point the SDK at dev.clomni.co
        if: inputs.environment == 'dev'
        run: |
          if ! grep -rl 'https://app.clomni.ai/v1' ios/Sources > "$RUNNER_TEMP/sdk-url-files"; then
            echo "::error::https://app.clomni.ai/v1 is not in ios/Sources any more; update this step."
            exit 1
          fi
          xargs sed -i '' 's#https://app\.clomni\.ai/v1#https://dev.clomni.co/app_sdk/v1#g' < "$RUNNER_TEMP/sdk-url-files"
          if grep -rn 'https://app.clomni.ai/v1' ios/Sources; then
            echo "::error::the SDK still has app.clomni.ai"
            exit 1
          fi
          grep -rn 'https://dev.clomni.co/app_sdk/v1' ios/Sources

      - name: xcodegen
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/Example/project.yml

      # A keychain of this run only, holding the Apple Distribution identity; the profiles where Xcode 16 looks
      # (UserData) and where earlier versions did (MobileDevice), each named by its UUID.
      - name: Certificate and profiles
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE_APP: ${{ secrets.IOS_PROFILE_APP }}
          IOS_PROFILE_NSE: ${{ secrets.IOS_PROFILE_NSE }}
        run: |
          umask 077
          keychain_password=$(openssl rand -base64 24)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          printf '%s' "$IOS_DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -f pkcs12 -P "$IOS_DIST_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          # The intermediate that issues Apple Distribution certificates, in case the image lacks it.
          if curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/AppleWWDRCAG3.cer"; then
            security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN" || true
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          identities=$(security find-identity -v -p codesigning "$KEYCHAIN")
          if ! grep -q '"Apple Distribution' <<< "$identities"; then
            echo "$identities"
            echo "::error::IOS_DIST_P12 holds no valid Apple Distribution identity (revoked or expired?). Run ios-signing-setup.yml again."
            exit 1
          fi
          dirs=("$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles")
          mkdir -p "${dirs[@]}"
          installed=""
          for name in IOS_PROFILE_APP IOS_PROFILE_NSE; do
            printf '%s' "${!name}" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
            security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
            expires=$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/profile.plist")
            echo "$name: $(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist"), $uuid, expires $expires"
            for dir in "${dirs[@]}"; do
              cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$uuid.mobileprovision"
            done
            installed="$installed $uuid"
          done
          rm -f "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          echo "PROFILE_UUIDS=$installed" >> "$GITHUB_ENV"

      # altool looks for the key in ~/private_keys by its id.
      - name: API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          mkdir -p ~/private_keys
          # A key copied on Windows carries CR line ends (and maybe a BOM); CryptoKit then rejects the PEM.
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' | sed '1s/^\xEF\xBB\xBF//' > ~/private_keys/AuthKey_"$ASC_KEY_ID".p8
          chmod 600 ~/private_keys/AuthKey_"$ASC_KEY_ID".p8
          if ! openssl pkey -in ~/private_keys/AuthKey_"$ASC_KEY_ID".p8 -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 is not a readable private key; paste the whole AuthKey_<id>.p8 file again."
            exit 1
          fi

      # Manual signing is set per target in project.yml (Release); only the profile names and the team come from
      # here, so the Swift package's resource bundle keeps its own settings.
      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROFILE_APP_NAME: ${{ secrets.IOS_PROFILE_APP_NAME }}
          IOS_PROFILE_NSE_NAME: ${{ secrets.IOS_PROFILE_NSE_NAME }}
          CLOMNI_APP_ID: ${{ secrets.CLOMNI_APP_ID }}
          CLOMNI_IOS_KEY: ${{ secrets.CLOMNI_IOS_KEY }}
        run: |
          xcodebuild archive \
            -project ios/Example/ClomniExample.xcodeproj \
            -scheme ClomniExample \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -skipPackagePluginValidation \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CLOMNI_PROFILE_APP="$IOS_PROFILE_APP_NAME" \
            CLOMNI_PROFILE_NSE="$IOS_PROFILE_NSE_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CLOMNI_APP_ID="$CLOMNI_APP_ID" \
            CLOMNI_API_KEY="$CLOMNI_IOS_KEY"

      - name: Export
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROFILE_APP_NAME: ${{ secrets.IOS_PROFILE_APP_NAME }}
          IOS_PROFILE_NSE_NAME: ${{ secrets.IOS_PROFILE_NSE_NAME }}
        run: |
          cp ios/Example/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          plutil -replace teamID -string "$APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          # Bundle id → profile name. Built as JSON: plutil key paths split on the dots of a bundle id.
          profiles=$(jq -cn --arg app "$IOS_PROFILE_APP_NAME" --arg nse "$IOS_PROFILE_NSE_NAME" \
            '{"ai.clomni.example": $app, "ai.clomni.example.NotificationService": $nse}')
          plutil -replace provisioningProfiles -json "$profiles" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$EXPORT" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ipa=$(ls "$EXPORT"/*.ipa)
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Clomni Example 1.0.0 ($BUILD_NUMBER), $CLOMNI_ENV: uploaded. TestFlight lists it once Apple has processed it." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the keychain, profiles and API key
        if: always()
        run: |
          [ -z "$KEYCHAIN" ] || security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          for uuid in $PROFILE_UUIDS; do
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision" \
              "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          done
          rm -rf ~/private_keys "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" \
            "$RUNNER_TEMP/AppleWWDRCAG3.cer" "$RUNNER_TEMP/ExportOptions.plist"
