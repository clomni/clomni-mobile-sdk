[versions]
# AGP 8.13 is the last line that runs on Gradle 8.x (AGP 9 needs Gradle 9).
agp = "8.13.2"
# The compiler can be new, but the SDK is compiled as Kotlin 1.9 (messenger/build.gradle.kts) and every runtime
# dependency must be built with Kotlin 1.9 or older, so that apps on Kotlin 1.8+ can read it: the brief's minimums
# are React Native 0.72+ and Flutter 3.16+, whose projects are often on Kotlin 1.8-1.9.
kotlin = "2.2.21"
kotlinStdlib = "1.9.25"
kotlinxSerialization = "1.6.3"
# OkHttp 5 is built with Kotlin 2; 4.12 (Kotlin 1.8, Okio 3.6) keeps the Kotlin 1.8+ promise.
okhttp = "4.12.0"
# Compose 1.8 (BOM 2025.07.00) depends on kotlin-stdlib 1.9.24; Compose 1.9 needs 2.0.
composeBom = "2025.07.00"
# Coil 2.7 depends on kotlin-stdlib 2.0; 2.6.0 on 1.9.22 (and the same OkHttp 4.12).
coil = "2.6.0"
# The Photo Picker and file picker contracts. Compose UI already brings activity 1.7.0 at runtime; declaring the
# same version adds nothing to an app's dependencies, it only puts the API on the compile classpath.
activity = "1.7.0"
# 2.0.0-alpha02: the last line on Java 17 that renders API 36 (layoutlib 15.2) with Compose 1.8.3; test-only.
paparazzi = "2.0.0-alpha02"
kover = "0.9.9"
# The public API's dump (messenger/api/messenger.api), checked by apiCheck: a change to it fails the build until the
# dump changes with it, where it can be reviewed. Build-time only.
binaryCompatibilityValidator = "0.18.1"
junit = "4.13.2"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binaryCompatibilityValidator" }
